# -----------------------------------------------------------------------------
# secrets.yaml — LOCAL AlloyDB / Postgres connection secrets  (EXAMPLE)
# -----------------------------------------------------------------------------
# Copy this file to  ikigai_masala-main/secrets.yaml  (git-ignored) and fill in
# your local / AlloyDB connection details. Used only when EMULATE_LOCAL=True.
#
#   cp secrets.example.yaml secrets.yaml
#   EMULATE_LOCAL=True streamlit run app.py
#
# In the cloud (EMULATE_LOCAL unset/False) the app does NOT read this file — it
# reads the same fields from the GCP Secret Manager secret `db-connection-config`
# (a JSON object with exactly these keys). A full `DATABASE_URL` env var, if set,
# overrides both.
#
# Override the file location with the SECRETS_YAML env var if you keep it
# elsewhere.
# -----------------------------------------------------------------------------

db:
  user: postgres          # DB_USER
  pass: postgres          # DB_PASS
  host: 127.0.0.1         # DB_HOST  (AlloyDB private IP / proxy in the cloud)
  port: 5432              # DB_PORT
  name: menu_engineering  # DB_NAME  (the database holding the 4 tables)
